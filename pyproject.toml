[project]
name = "pneumonia-detection"
version = "0.1.0"
description = "Deep Learning end-to-end: detection de pneumonie sur radiographies thoraciques (Chest X-Ray)"
authors = [{ name = "Florian" }]
readme = "README.md"
requires-python = ">=3.10,<3.12"

dependencies = [
    # --- Deep Learning ---
    "tensorflow==2.16.1",           
    #"tensorflow-macos==2.16.1",    
    #"tensorflow-metal==1.1.0",    

    "numpy>=1.26,<2.0",              
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",             

    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pillow>=10.3",                  

    "opencv-python>=4.10",         
    "albumentations>=1.4",           

    "kaggle>=1.6",                
    "kagglehub>=0.3",              
    "python-dotenv>=1.0",            

    # --- Notebook & outils ---
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",            
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.5",
    "isort>=5.13",
]
# Interpretabilite avancee (Grad-CAM out-of-the-box)
explain = [
    "tf-keras-vis>=0.8",            
    "scikit-image>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.isort]
profile = "black"
line_length = 100
